<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Portail ASECNA</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --asecna-blue: #004a99;
            --asecna-light-blue: #00a8e8;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Arrière-plan dynamique aéronautique */
        .bg-aero {
            background: linear-gradient(rgba(0, 51, 102, 0.7), rgba(0, 51, 102, 0.7)), 
                        url('https://images.unsplash.com/photo-1506012733851-462978393e2f?auto=format&fit=crop&q=80&w=1600') no-repeat center center fixed;
            background-size: cover;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Carte style Glassmorphism (Effet Cockpit) */
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-weight: 900;
            color: var(--asecna-blue);
            font-size: 32px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0;
        }

        .logo-subtext {
            font-size: 12px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--asecna-light-blue);
            box-shadow: 0 0 8px rgba(0, 168, 232, 0.2);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--asecna-blue);
            z-index: 10;
        }

        .btn-asecna {
            background: linear-gradient(45deg, var(--asecna-blue), #003366);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-asecna:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 74, 153, 0.4);
            color: #fff;
            background: linear-gradient(45deg, #003366, var(--asecna-blue));
        }

        .footer-text {
            font-size: 11px;
            color: #666;
            margin-top: 25px;
            text-align: center;
        }

        /* Petit trait décoratif "Piste d'envol" */
        .runway-line {
            height: 4px;
            width: 50px;
            background: var(--asecna-light-blue);
            margin: 10px auto 20px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="bg-aero">
    <div class="login-card">
        <div class="logo-section">
            <h1 class="logo-text">ASECNA</h1>
            <div class="runway-line"></div>
            <p class="logo-subtext">Système de Reporting Expert</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2" style="font-size: 14px;">
                <i class="fas fa-exclamation-circle me-2"></i> Identifiants invalides
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" class="form-control" placeholder="Nom d'utilisateur" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-asecna">
                    <i class="fas fa-plane-departure me-2"></i> Initialiser la session
                </button>
            </div>
        </form>
        
        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Espace sécurisé - Direction de l'Exploitation<br>
            <strong>&copy; 2026 ASECNA - Sécurité de la Navigation Aérienne</strong>
        </div>
    </div>
</div>

</body>
</html>
